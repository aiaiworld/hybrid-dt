[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-dt-reproducibility"
version = "1.0.0"
description = "Reproducibility artifact for Hybrid-DT in 5G Core networks"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
  {name = "Anonymous Authors"}
]
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3"
]

[tool.setuptools]
packages = ["benchmark"]
